name: Setup
description: "JFrog npm mirror (non-fork PRs), Node, pnpm with store cache, and frozen-lockfile install. Run after checkout; the calling job needs id-token write permission."

runs:
  using: composite
  steps:
    - name: Setup JFrog CLI with OIDC
      if: ${{ !github.event.pull_request.head.repo.fork }}
      id: setup-jfrog
      uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
      env:
        JF_URL: https://databricks.jfrog.io
      with:
        oidc-provider-name: github-actions
    - name: Configure npm registry (Databricks JFrog mirror)
      if: ${{ !github.event.pull_request.head.repo.fork }}
      shell: bash
      run: |
        echo "::add-mask::${{ steps.setup-jfrog.outputs.oidc-token }}"
        cat > ~/.npmrc <<EOF
        registry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/
        //databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}
        always-auth=true
        EOF
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        package_json_file: package.json
    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm dependencies
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
