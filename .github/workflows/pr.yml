name: Lint and Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-build:
    name: lint-build
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Validate server.json version sync
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const server=JSON.parse(fs.readFileSync('server.json','utf8')); if (pkg.version !== server.version) { console.error('Version mismatch: package.json=' + pkg.version + ' server.json=' + server.version); process.exit(1); }"
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Check unused code and dependencies
        run: pnpm knip
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

  test:
    needs: lint-build
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Server tests
        run: pnpm test:ci

  e2e-web:
    needs: lint-build
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Website e2e tests
        run: pnpm test:e2e:web

  e2e-live:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [test, e2e-web]
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run live Neon E2E tests
        env:
          NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: pnpm test:e2e:live

  # The required status check is named "lint-and-build"; this job keeps that name so
  # branch protection also gates on test and e2e-web. e2e-live is excluded on purpose
  # because it depends on live Neon and must not block merges. A skipped dependency
  # means an upstream job failed, so anything other than success fails the gate.
  lint-and-build:
    name: lint-and-build
    if: ${{ !cancelled() }}
    needs: [lint-build, test, e2e-web]
    permissions:
      contents: read
    runs-on:
      group: databricks-ghec-untrusted-runner-group
      labels: linux-ubuntu-latest-untrusted-2core-8gb
    steps:
      - name: Require all gated jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gated job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
