name: Lint and Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: neondatabase-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JFrog CLI with OIDC
        id: setup-jfrog
        uses: jfrog/setup-jfrog-cli@279b1f629f43dd5bc658d8361ac4802a7ef8d2d5 # v4.9.1
        env:
          JF_URL: https://databricks.jfrog.io
        with:
          oidc-provider-name: github-actions
      - name: Configure npm registry for JFrog
        run: |
          echo "::add-mask::${{ steps.setup-jfrog.outputs.oidc-token }}"
          printf 'save-exact=true\nshamefully-hoist=true\nregistry=https://databricks.jfrog.io/artifactory/api/npm/db-npm/\n' > .npmrc
          echo "//databricks.jfrog.io/artifactory/api/npm/db-npm/:_authToken=${{ steps.setup-jfrog.outputs.oidc-token }}" >> .npmrc
          cp .npmrc ~/.npmrc
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate server.json version sync
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); const server=JSON.parse(fs.readFileSync('server.json','utf8')); if (pkg.version !== server.version) { console.error('Version mismatch: package.json=' + pkg.version + ' server.json=' + server.version); process.exit(1); }"
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Check unused code and dependencies
        run: pnpm knip
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm test
      - name: Run live Neon E2E tests
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        env:
          NEON_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
        run: pnpm test:e2e:live
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
